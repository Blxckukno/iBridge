    <title>Security Dashboard - iBridge</title>
    <style>
        :root {
            --primary-color: #A1C44F;
            --secondary-color: #2C3E50;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #17a2b8;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --border-color: #dee2e6;
            --dark-bg: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light-bg);
            color: var(--secondary-color);
            line-height: 1.6;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            background: linear-gradient(135deg, var(--danger-color), #e74c3c);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .status-card:hover {
            transform: translateY(-5px);
        }

        .status-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
        }

        .status-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .status-label {
            font-size: 0.9rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .secure {
            background: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
        }

        .warning {
            background: rgba(255, 193, 7, 0.1);
            color: var(--warning-color);
        }

        .critical {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
        }

        .info {
            background: rgba(23, 162, 184, 0.1);
            color: var(--info-color);
        }

        .security-sections {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .section-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .security-check {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            background: var(--light-bg);
            transition: all 0.3s ease;
        }

        .security-check:hover {
            background: rgba(161, 196, 79, 0.1);
        }

        .check-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .check-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .check-passed {
            background: var(--success-color);
        }

        .check-failed {
            background: var(--danger-color);
        }

        .check-warning {
            background: var(--warning-color);
        }

        .events-log {
            max-height: 400px;
            overflow-y: auto;
            background: var(--dark-bg);
            border-radius: 8px;
            padding: 1rem;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-timestamp {
            color: #888;
        }

        .log-type {
            font-weight: bold;
            text-transform: uppercase;
        }

        .log-error {
            color: #ff6b6b;
        }

        .log-warning {
            color: #feca57;
        }

        .log-info {
            color: #48cae4;
        }

        .log-success {
            color: #00ff00;
        }

        .threats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .threat-item {
            padding: 1rem;
            border-left: 4px solid;
            border-radius: 0 8px 8px 0;
            margin: 0.5rem 0;
        }

        .threat-high {
            border-color: var(--danger-color);
            background: rgba(220, 53, 69, 0.05);
        }

        .threat-medium {
            border-color: var(--warning-color);
            background: rgba(255, 193, 7, 0.05);
        }

        .threat-low {
            border-color: var(--info-color);
            background: rgba(23, 162, 184, 0.05);
        }

        .recommendations {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-top: 2rem;
        }

        .recommendations h2 {
            margin-bottom: 1rem;
        }

        .recommendation-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 1rem;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>

<body>
    <div class="dashboard">
        <div class="header">
            <h1>🛡️ Security Command Center</h1>
            <p>Enterprise-grade security monitoring and threat detection for iBridge</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary">
                🔄 Refresh Status
            </button>
            <button class="btn btn-success">
                🔍 Security Scan
            </button>
            <button class="btn btn-danger">
                ⚠️ View Threats
            </button>
        </div>

        <div class="status-grid" id="statusGrid">
            <!-- Status cards will be populated by JavaScript -->
        </div>

        <div class="security-sections">
            <div class="section-card">
                <h2 class="section-title">🔒 Security Checks</h2>
                <div id="securityChecks">
                    <!-- Security checks will be populated by JavaScript -->
                </div>
            </div>

            <div class="section-card">
                <h2 class="section-title">📊 Security Events Log</h2>
                <div class="events-log" id="eventsLog">
                    <!-- Events will be populated by JavaScript -->
                </div>
            </div>

            <div class="section-card">
                <h2 class="section-title">⚠️ Active Threats</h2>
                <div class="threats-panel" id="threatsPanel">
                    <!-- Threats will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="recommendations" id="recommendations">
            <h2>🎯 Security Recommendations</h2>
            <div id="recommendationsList">
                <!-- Recommendations will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script nonce="m2/1fq5poK1XBS7iEFirfnTypL07gSFk">
        class SecurityDashboard {
            constructor() {
                this.securityData = {};
                this.init();
            }

            init() {
                this.loadSecurityData();
                this.renderDashboard();
                this.startAutoRefresh();
            }

            loadSecurityData() {
                // Get security data from the main security manager
                if (window.opener && window.opener.securityManager) {
                    this.securityData = window.opener.securityManager.getSecurityReport();
                } else {
                    // Fallback to local data
                    this.generateMockData();
                }
            }

            generateMockData() {
                this.securityData = {
                    timestamp: new Date().toISOString(),
                    config: {
                        csp: { enabled: true },
                        headers: { hsts: true, frameOptions: 'DENY' },
                        csrf: { enabled: true },
                        monitoring: { enabled: true }
                    },
                    events: [
                        {
                            timestamp: new Date().toISOString(),
                            type: 'SECURITY_INIT',
                            message: 'Security Manager initialized successfully'
                        }
                    ],
                    blockedAttempts: [],
                    metrics: {
                        totalEvents: 1,
                        errorEvents: 0,
                        violations: 0,
                        suspiciousInputs: 0
                    }
                };
            }

            renderDashboard() {
                this.renderStatusCards();
                this.renderSecurityChecks();
                this.renderEventsLog();
                this.renderThreats();
                this.renderRecommendations();
            }

            renderStatusCards() {
                const statusGrid = document.getElementById('statusGrid');
                const metrics = this.securityData.metrics || {};

                const statusCards = [
                    {
                        label: 'Security Score',
                        value: this.calculateSecurityScore(),
                        unit: '/100',
                        icon: '🛡️',
                        status: this.getSecurityStatus(),
                        description: 'Overall security rating'
                    },
                    {
                        label: 'Active Threats',
                        value: metrics.violations || 0,
                        unit: '',
                        icon: '⚠️',
                        status: metrics.violations > 0 ? 'critical' : 'secure',
                        description: 'Detected security violations'
                    },
                    {
                        label: 'Blocked Attempts',
                        value: (this.securityData.blockedAttempts || []).length,
                        unit: '',
                        icon: '🚫',
                        status: 'info',
                        description: 'Malicious attempts blocked'
                    },
                    {
                        label: 'Security Events',
                        value: metrics.totalEvents || 0,
                        unit: '',
                        icon: '📋',
                        status: 'info',
                        description: 'Total security events logged'
                    }
                ];

                statusGrid.innerHTML = statusCards.map(card => `
                    <div class="status-card">
                        <div class="status-icon ${card.status}">
                            ${card.icon}
                        </div>
                        <div class="status-value">${card.value}${card.unit}</div>
                        <div class="status-label">${card.label}</div>
                        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">
                            ${card.description}
                        </p>
                    </div>
                `).join('');
            }

            renderSecurityChecks() {
                const checksContainer = document.getElementById('securityChecks');
                const config = this.securityData.config || {};

                const checks = [
                    {
                        name: 'Content Security Policy',
                        status: config.csp?.enabled ? 'passed' : 'failed',
                        description: 'Prevents XSS and code injection attacks'
                    },
                    {
                        name: 'HTTPS Enforcement',
                        status: location.protocol === 'https:' ? 'passed' : 'failed',
                        description: 'Encrypts data in transit'
                    },
                    {
                        name: 'Security Headers',
                        status: config.headers?.frameOptions ? 'passed' : 'warning',
                        description: 'X-Frame-Options, X-Content-Type-Options'
                    },
                    {
                        name: 'CSRF Protection',
                        status: config.csrf?.enabled ? 'passed' : 'failed',
                        description: 'Prevents cross-site request forgery'
                    },
                    {
                        name: 'Input Validation',
                        status: 'passed',
                        description: 'Validates and sanitizes user input'
                    },
                    {
                        name: 'Security Monitoring',
                        status: config.monitoring?.enabled ? 'passed' : 'warning',
                        description: 'Real-time security event monitoring'
                    }
                ];

                checksContainer.innerHTML = checks.map(check => `
                    <div class="security-check">
                        <div class="check-info">
                            <div class="check-status check-${check.status}">
                                ${check.status === 'passed' ? '✓' : check.status === 'failed' ? '✗' : '!'}
                            </div>
                            <div>
                                <strong>${check.name}</strong>
                                <div style="font-size: 0.85rem; opacity: 0.7;">
                                    ${check.description}
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            renderEventsLog() {
                const eventsLog = document.getElementById('eventsLog');
                const events = (this.securityData.events || []).slice(-20); // Last 20 events

                if (events.length === 0) {
                    eventsLog.innerHTML = '<div class="log-entry">No security events recorded.</div>';
                    return;
                }

                eventsLog.innerHTML = events.map(event => `
                    <div class="log-entry">
                        <span class="log-timestamp">[${new Date(event.timestamp).toLocaleTimeString()}]</span>
                        <span class="log-type log-${this.getLogClass(event.type)}">${event.type}</span>
                        <span>${event.message}</span>
                    </div>
                `).join('');

                // Auto-scroll to bottom
                eventsLog.scrollTop = eventsLog.scrollHeight;
            }

            renderThreats() {
                const threatsPanel = document.getElementById('threatsPanel');
                const threats = this.identifyThreats();

                if (threats.length === 0) {
                    threatsPanel.innerHTML = `
                        <div class="threat-item threat-low">
                            <strong>✅ No Active Threats</strong><br>
                            All security systems are functioning normally.
                        </div>
                    `;
                    return;
                }

                threatsPanel.innerHTML = threats.map(threat => `
                    <div class="threat-item threat-${threat.level}">
                        <strong>${threat.title}</strong><br>
                        ${threat.description}
                        <div style="margin-top: 0.5rem; font-size: 0.8rem; opacity: 0.8;">
                            Detected: ${threat.timestamp}
                        </div>
                    </div>
                `).join('');
            }

            renderRecommendations() {
                const recommendationsList = document.getElementById('recommendationsList');
                const recommendations = this.generateRecommendations();

                recommendationsList.innerHTML = recommendations.map(rec => `
                    <div class="recommendation-item">
                        <strong>${rec.title}</strong><br>
                        ${rec.description}
                    </div>
                `).join('');
            }

            calculateSecurityScore() {
                let score = 100;
                const config = this.securityData.config || {};
                const metrics = this.securityData.metrics || {};

                if (!config.csp?.enabled) score -= 20;
                if (location.protocol !== 'https:') score -= 25;
                if (!config.csrf?.enabled) score -= 15;
                if (metrics.violations > 0) score -= metrics.violations * 5;
                if (metrics.errorEvents > 0) score -= metrics.errorEvents * 2;

                return Math.max(0, Math.round(score));
            }

            getSecurityStatus() {
                const score = this.calculateSecurityScore();
                if (score >= 90) return 'secure';
                if (score >= 70) return 'warning';
                return 'critical';
            }

            getLogClass(type) {
                if (type.includes('ERROR') || type.includes('VIOLATION')) return 'error';
                if (type.includes('WARNING') || type.includes('SUSPICIOUS')) return 'warning';
                if (type.includes('INIT') || type.includes('ENABLED')) return 'success';
                return 'info';
            }

            identifyThreats() {
                const threats = [];
                const events = this.securityData.events || [];
                const metrics = this.securityData.metrics || {};

                // Check for recent violations
                const recentViolations = events.filter(e =>
                    e.type.includes('VIOLATION') &&
                    Date.now() - new Date(e.timestamp).getTime() < 300000
                );

                if (recentViolations.length > 0) {
                    threats.push({
                        title: 'Content Security Policy Violations',
                        description: `${recentViolations.length} CSP violations detected in the last 5 minutes`,
                        level: 'high',
                        timestamp: new Date().toLocaleString()
                    });
                }

                // Check for suspicious inputs
                if (metrics.suspiciousInputs > 0) {
                    threats.push({
                        title: 'Suspicious Input Detected',
                        description: `${metrics.suspiciousInputs} potentially malicious inputs blocked`,
                        level: 'medium',
                        timestamp: new Date().toLocaleString()
                    });
                }

                return threats;
            }

            generateRecommendations() {
                const recommendations = [];
                const config = this.securityData.config || {};
                const score = this.calculateSecurityScore();

                if (score < 90) {
                    recommendations.push({
                        title: 'Enhance Security Configuration',
                        description: 'Review and strengthen security settings to achieve optimal protection.'
                    });
                }

                if (location.protocol !== 'https:') {
                    recommendations.push({
                        title: 'Enable HTTPS',
                        description: 'Implement SSL/TLS encryption to secure data transmission.'
                    });
                }

                if (!config.csp?.enabled) {
                    recommendations.push({
                        title: 'Implement Content Security Policy',
                        description: 'Add CSP headers to prevent XSS and code injection attacks.'
                    });
                }

                recommendations.push({
                    title: 'Regular Security Audits',
                    description: 'Schedule periodic security assessments and penetration testing.'
                });

                return recommendations;
            }

            startAutoRefresh() {
                setInterval(() => {
                    this.loadSecurityData();
                    this.renderDashboard();
                }, 30000); // Refresh every 30 seconds
            }
        }

        // Dashboard instance
        let securityDashboard;

        document.addEventListener('DOMContentLoaded', () => {
            securityDashboard = new SecurityDashboard();
        });

        function refreshSecurity() {
            if (securityDashboard) {
                securityDashboard.loadSecurityData();
                securityDashboard.renderDashboard();
            }
        }

        function runSecurityScan() {
            alert('Security scan initiated. Check events log for results.');
            // In a real implementation, this would trigger a comprehensive security scan
        }

        function viewThreats() {
            const threatsSection = document.getElementById('threatsPanel');
            threatsSection.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
