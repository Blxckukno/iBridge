            color: var(--primary-green);

            position: absolute;
            left: 0;

            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;

        .retry-btn:hover {

    <script nonce="bFniWuVBnas0GtHPNsVsN8T6HvfyRSr8">
        // Check for connection and automatically retry
        window.addEventListener('online', function () {
            setTimeout(function () {
                window.location.reload();
            }, 1000);
        });

        // Add some visual feedback when trying to reconnect
        function retryConnection() {
            const btn = document.querySelector('.retry-btn');
            const icon = btn.querySelector('i');

            btn.disabled = true;
            btn.style.opacity = '0.7';
            icon.style.animation = 'spin 1s linear infinite';

            setTimeout(function () {
                window.location.reload();
            }, 1000);
        }

        // Update button to use the new function
        document.querySelector('.retry-btn').onclick = retryConnection;

        // Add spin animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
