<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="apple-touch-icon" href="../../images/favicon.png">
    <style id="render-fallback-style">
        body { opacity: 1 !important; visibility: visible !important; }
        main, section, header, footer, article, nav, div { visibility: visible; }</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Ticket - iBridge Staff Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: #2d5a27;
            color: white;
            padding: 2rem;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .sidebar nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .sidebar nav a:hover {
            background: rgba(255, 255, 255, 0.1);
            padding-left: 1rem;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            background: white;
            margin: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2d5a27;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            background: #2d5a27;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-right: 1rem;
        }

        .btn:hover {
            background: #1e3b1a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #666;
        }

        .btn-secondary:hover {
            background: #555;
        }

        .back-btn {
            margin-bottom: 2rem;
        }        /* Breakpoint Hardening OV2 */
        html, body { max-width: 100%; overflow-x: hidden; }
        img, iframe, video, canvas, svg { max-width: 100%; height: auto; }
        .container, .main-content, .dashboard-grid, .content, .lms-main { min-width: 0; }

        @media (max-width: 1024px) {
            .container { padding-left: 16px !important; padding-right: 16px !important; }
            .dashboard-container, .settings-container, .main-container { grid-template-columns: 1fr !important; }
            .sidebar { width: 100% !important; position: relative !important; height: auto !important; }
            .main-content { margin-left: 0 !important; padding: 20px 16px !important; }
        }

        @media (max-width: 768px) {
            .header .container, .header-content { padding-left: 14px !important; padding-right: 14px !important; }
            .hero h1 { font-size: clamp(1.7rem, 6vw, 2.3rem) !important; line-height: 1.2; }
            .services-grid, .values-grid, .stats-grid, .features-grid, .report-cards, .dashboard-grid, .course-actions { grid-template-columns: 1fr !important; }
            .form-row, .action-buttons { grid-template-columns: 1fr !important; }
            .modal-content { width: min(94vw, 700px) !important; max-height: 85vh; overflow: auto; }
            .whatsapp-float { right: 14px !important; bottom: 14px !important; }
        }

        @media (max-width: 375px) {
            body { font-size: 15px; }
            .container { padding-left: 12px !important; padding-right: 12px !important; }
            .btn, .submit-btn, .action-btn { width: 100%; justify-content: center; }
            .card-value { font-size: 1.8rem !important; }
            .user-profile { gap: 6px !important; }
            .user-profile div { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        }

        @media (max-width: 320px) {
            .container { padding-left: 10px !important; padding-right: 10px !important; }
            .logo img { max-height: 36px !important; width: auto !important; }
            .hero h1 { font-size: 1.5rem !important; }
            .nav-menu, .sidebar-nav { font-size: 0.95rem; }
            .modal-content { width: 96vw !important; }
        }
    </style>
    <script src="../../js/staff-auth-guard.js"></script>
    <script src="../../js/staff-rbac.js"></script>
    <script>
      if (window.iBridgeStaffAuth) { window.iBridgeStaffAuth.ensureAccess(); }
      if (window.iBridgeRBAC) { window.iBridgeRBAC.enforcePageAccess("agent"); }
    </script>
</head>

<body>
    <div class="sidebar">
        <h2>iBridge Staff Portal</h2>
        <nav>
            <a href="professional-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="create-ticket.html" class="active"><i class="fas fa-ticket-alt"></i> Tickets</a>
            <a href="generate-reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
            <a href="user-management.html"><i class="fas fa-users"></i> User Management</a>
            <a href="../../lms-platform.html"><i class="fas fa-graduation-cap"></i> LMS Platform</a>
            <a href="professional-dashboard.html"><i class="fas fa-building"></i> Intranet</a>
            <a href="staff-blog.html"><i class="fas fa-newspaper"></i> Staff Blog</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            <a href="../../index.html"><i class="fas fa-home"></i> Back to Main Site</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="back-btn">
            <a href="professional-dashboard.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div class="header">
            <h1>Create New Ticket</h1>
            <p>Submit a new support ticket for processing</p>
        </div>

        <div class="form-container">
            <form id="ticketForm" action="javascript:void(0)" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="ticketTitle">Ticket Title *</label>
                        <input type="text" id="ticketTitle" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority Level *</label>
                        <select id="priority" name="priority" required>
                            <option value="">Select Priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Technical Support">Technical Support</option>
                            <option value="Account Management">Account Management</option>
                            <option value="Billing Inquiry">Billing Inquiry</option>
                            <option value="Feature Request">Feature Request</option>
                            <option value="Bug Report">Bug Report</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="assignedTo">Assign To</label>
                        <select id="assignedTo" name="assigned_to">
                            <option value="">Auto-assign</option>
                            <option value="john.smith">John Smith - Technical</option>
                            <option value="sarah.johnson">Sarah Johnson - Account Mgmt</option>
                            <option value="mike.wilson">Mike Wilson - Billing</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" name="customer_name">
                </div>

                <div class="form-group">
                    <label for="customerEmail">Customer Email</label>
                    <input type="email" id="customerEmail" name="customer_email">
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" rows="6" required
                        placeholder="Please describe the issue in detail..."></textarea>
                </div>

                <div class="form-group">
                    <label for="attachments">Attachments</label>
                    <input type="file" id="attachments" name="attachments" multiple>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn">
                        <i class="fas fa-plus"></i> Create Ticket
                    </button>
                    <a href="professional-dashboard.html" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('ticketForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Collect form data
            const formData = new FormData(this);
            const ticketData = Object.fromEntries(formData);

            const token =
                localStorage.getItem('access_token') ||
                sessionStorage.getItem('access_token') ||
                localStorage.getItem('token') ||
                localStorage.getItem('jwt_token') ||
                '';

            if (!token) {
                alert('Please sign in to Staff Portal before creating tickets.');
                return;
            }

            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: ticketData.title,
                        description: ticketData.description,
                        priority: ticketData.priority,
                        category: ticketData.category
                    })
                });

                if (!response.ok) {
                    const payload = await response.json().catch(() => ({}));
                    throw new Error(payload.error || `HTTP ${response.status}`);
                }
                const created = await response.json().catch(() => ({}));
                const ticketId = created.id ? `TICKET-${created.id}` : 'TICKET-CREATED';
                alert(
                    `Ticket submitted successfully: ${ticketId}\n\n` +
                    `Title: ${ticketData.title}\nPriority: ${ticketData.priority}\nCategory: ${ticketData.category}`
                );
                window.location.href = 'professional-dashboard.html';
            } catch (error) {
                alert(`Ticket submission failed: ${error.message}`);
            }
        });
    </script>
    <script src="../../js/runtime-fix.js"></script>
</body>

</html>
