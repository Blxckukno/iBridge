<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="apple-touch-icon" href="../../images/favicon.png">
    <style id="render-fallback-style">
        body { opacity: 1 !important; visibility: visible !important; }
        main, section, header, footer, article, nav, div { visibility: visible; }</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - iBridge Staff Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: #2d5a27;
            color: white;
            padding: 2rem;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .sidebar nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .sidebar nav a:hover {
            background: rgba(255, 255, 255, 0.1);
            padding-left: 1rem;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            background: white;
            margin: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .btn {
            background: #2d5a27;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #1e3b1a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #666;
        }

        .btn-secondary:hover {
            background: #555;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .search-bar {
            margin-bottom: 2rem;
        }

        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .users-table th,
        .users-table td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid #ddd;
        }

        .users-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .user-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 1rem;
            }

            .main-content {
                margin: 1rem;
            }

            .users-table {
                font-size: 0.875rem;
            }
        }        /* Breakpoint Hardening OV2 */
        html, body { max-width: 100%; overflow-x: hidden; }
        img, iframe, video, canvas, svg { max-width: 100%; height: auto; }
        .container, .main-content, .dashboard-grid, .content, .lms-main { min-width: 0; }

        @media (max-width: 1024px) {
            .container { padding-left: 16px !important; padding-right: 16px !important; }
            .dashboard-container, .settings-container, .main-container { grid-template-columns: 1fr !important; }
            .sidebar { width: 100% !important; position: relative !important; height: auto !important; }
            .main-content { margin-left: 0 !important; padding: 20px 16px !important; }
        }

        @media (max-width: 768px) {
            .header .container, .header-content { padding-left: 14px !important; padding-right: 14px !important; }
            .hero h1 { font-size: clamp(1.7rem, 6vw, 2.3rem) !important; line-height: 1.2; }
            .services-grid, .values-grid, .stats-grid, .features-grid, .report-cards, .dashboard-grid, .course-actions { grid-template-columns: 1fr !important; }
            .form-row, .action-buttons { grid-template-columns: 1fr !important; }
            .modal-content { width: min(94vw, 700px) !important; max-height: 85vh; overflow: auto; }
            .whatsapp-float { right: 14px !important; bottom: 14px !important; }
        }

        @media (max-width: 375px) {
            body { font-size: 15px; }
            .container { padding-left: 12px !important; padding-right: 12px !important; }
            .btn, .submit-btn, .action-btn { width: 100%; justify-content: center; }
            .card-value { font-size: 1.8rem !important; }
            .user-profile { gap: 6px !important; }
            .user-profile div { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        }

        @media (max-width: 320px) {
            .container { padding-left: 10px !important; padding-right: 10px !important; }
            .logo img { max-height: 36px !important; width: auto !important; }
            .hero h1 { font-size: 1.5rem !important; }
            .nav-menu, .sidebar-nav { font-size: 0.95rem; }
            .modal-content { width: 96vw !important; }
        }
    </style>
    <script src="../../js/staff-auth-guard.js"></script>
    <script src="../../js/staff-rbac.js"></script>
    <script>
      if (window.iBridgeStaffAuth) { window.iBridgeStaffAuth.ensureAccess(); }
      if (window.iBridgeRBAC) { window.iBridgeRBAC.enforcePageAccess("admin"); }
    </script>
</head>

<body>
    <div class="sidebar">
        <h2>iBridge Staff Portal</h2>
        <nav>
            <a href="professional-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="create-ticket.html"><i class="fas fa-ticket-alt"></i> Tickets</a>
            <a href="generate-reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
            <a href="user-management.html" class="active"><i class="fas fa-users"></i> User Management</a>
            <a href="../../lms-platform.html"><i class="fas fa-graduation-cap"></i> LMS Platform</a>
            <a href="professional-dashboard.html"><i class="fas fa-building"></i> Intranet</a>
            <a href="staff-blog.html"><i class="fas fa-newspaper"></i> Staff Blog</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            <a href="../../index.html"><i class="fas fa-home"></i> Back to Main Site</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>User Management</h1>
                <p>Manage system users and access permissions</p>
            </div>
            <button class="btn" onclick="openAddUserModal()">
                <i class="fas fa-plus"></i> Add New User
            </button>
        </div>

        <div class="search-bar">
            <input type="text" id="userSearch" placeholder="Search users by name, email, or role..."
                onkeyup="searchUsers()">
        </div>
        <p id="modeHint" style="margin-bottom: 1rem; color: #666;">Loading users...</p>

        <table class="users-table" id="usersTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Last Login</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="modal">
        <div class="modal-content">
            <h3>Add New User</h3>
        <form id="addUserForm" action="javascript:void(0)" method="post" onsubmit="addUser(event)">
                <div class="form-group">
                    <label for="newUserName">Full Name</label>
                    <input type="text" id="newUserName" required>
                </div>
                <div class="form-group">
                    <label for="newUserEmail">Email Address</label>
                    <input type="email" id="newUserEmail" required>
                </div>
                <div class="form-group">
                    <label for="newUserRole">Role</label>
                    <select id="newUserRole" required>
                        <option value="">Select Role</option>
                        <option value="Agent">Agent</option>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="newUserPassword">Temporary Password</label>
                    <input type="password" id="newUserPassword" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn">Add User</button>
                    <button type="button" class="btn btn-secondary" onclick="closeAddUserModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const USERS_STORAGE_KEY = 'ibridge_local_users_v1';
        let currentUsers = [];
        let apiMode = false;

        function openAddUserModal() {
            document.getElementById('addUserModal').style.display = 'block';
        }

        function closeAddUserModal() {
            document.getElementById('addUserModal').style.display = 'none';
            document.getElementById('addUserForm').reset();
        }

        function getToken() {
            return sessionStorage.getItem('access_token')
                || localStorage.getItem('access_token')
                || localStorage.getItem('token')
                || '';
        }

        function setModeHint(text) {
            const el = document.getElementById('modeHint');
            if (el) el.textContent = text;
        }

        function readLocalUsers() {
            const raw = localStorage.getItem(USERS_STORAGE_KEY);
            if (!raw) {
                const seed = [
                    { id: -1, username: 'john.smith', email: 'john.smith@ibridge.com', role: 'admin', is_active: true, last_login: '2025-11-06T09:30:00' },
                    { id: -2, username: 'sarah.johnson', email: 'sarah.johnson@ibridge.com', role: 'manager', is_active: true, last_login: '2025-11-06T08:45:00' },
                    { id: -3, username: 'mike.wilson', email: 'mike.wilson@ibridge.com', role: 'agent', is_active: true, last_login: '2025-11-05T16:20:00' },
                    { id: -4, username: 'lisa.chen', email: 'lisa.chen@ibridge.com', role: 'agent', is_active: false, last_login: '2025-10-28T14:10:00' }
                ];
                localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(seed));
                return seed;
            }
            try {
                return JSON.parse(raw);
            } catch (error) {
                return [];
            }
        }

        function saveLocalUsers(users) {
            localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
        }

        function normalizeRole(role) {
            return String(role || 'staff').trim().toLowerCase();
        }

        function roleLabel(role) {
            const r = String(role || 'staff');
            return r.charAt(0).toUpperCase() + r.slice(1);
        }

        function formatLastLogin(value) {
            if (!value) return 'Never';
            const dt = new Date(value);
            if (Number.isNaN(dt.getTime())) return String(value);
            return dt.toLocaleString();
        }

        function renderUsers(rows) {
            const tbody = document.getElementById('usersTableBody');
            if (!tbody) return;
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6">No users found.</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map(user => {
                const statusClass = user.is_active ? 'status-active' : 'status-inactive';
                const statusText = user.is_active ? 'Active' : 'Inactive';
                const toggleLabel = user.is_active ? 'Deactivate' : 'Activate';
                const toggleClass = user.is_active ? 'btn-secondary' : 'btn-danger';
                const displayName = user.full_name || user.username || user.email || 'Unknown';
                return `
                    <tr>
                        <td>${displayName}</td>
                        <td>${user.email || ''}</td>
                        <td>${roleLabel(user.role)}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${formatLastLogin(user.last_login)}</td>
                        <td class="user-actions">
                            <button class="btn btn-small" onclick="editUser(${user.id})">Edit</button>
                            <button class="btn btn-small btn-secondary" onclick="resetPassword(${user.id})">Reset PWD</button>
                            <button class="btn btn-small ${toggleClass}" onclick="toggleUserStatus(${user.id})">${toggleLabel}</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function apiRequest(path, method = 'GET', body = null) {
            const token = getToken();
            if (!token) throw new Error('No access token found');
            const response = await fetch(path, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: body ? JSON.stringify(body) : null
            });
            if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload.error || `HTTP ${response.status}`);
            }
            return response.json();
        }

        async function loadUsers() {
            try {
                const payload = await apiRequest('/api/users', 'GET');
                apiMode = true;
                currentUsers = Array.isArray(payload.users) ? payload.users : [];
                setModeHint(`Live API mode: ${currentUsers.length} users`);
                renderUsers(currentUsers);
                return;
            } catch (error) {
                apiMode = false;
                currentUsers = readLocalUsers();
                setModeHint(`Build mode (local): ${currentUsers.length} users`);
                renderUsers(currentUsers);
            }
        }

        function buildUsername(name, email) {
            const fromEmail = String(email || '').split('@')[0].replace(/[^a-zA-Z0-9._-]/g, '');
            if (fromEmail) return fromEmail.toLowerCase();
            return String(name || 'staff.user').trim().toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '');
        }

        async function addUser(event) {
            event.preventDefault();
            const name = document.getElementById('newUserName').value;
            const email = document.getElementById('newUserEmail').value;
            const role = document.getElementById('newUserRole').value;
            const password = document.getElementById('newUserPassword').value;
            const username = buildUsername(name, email);

            if (!name || !email || !role || !password) {
                alert('Please complete all required fields.');
                return;
            }

            try {
                if (apiMode) {
                    const result = await apiRequest('/api/users', 'POST', {
                        username,
                        email,
                        role: normalizeRole(role),
                        password
                    });
                    alert(`User created successfully.\n\nUsername: ${result.user.username}\nTemporary password: ${result.temporary_password}`);
                    closeAddUserModal();
                    await loadUsers();
                    return;
                }

                const local = readLocalUsers();
                const newUser = {
                    id: Date.now(),
                    username,
                    email,
                    role: normalizeRole(role),
                    is_active: true,
                    last_login: null
                };
                local.unshift(newUser);
                saveLocalUsers(local);
                currentUsers = local;
                renderUsers(currentUsers);
                alert(`Build mode: user added locally.\n\nUsername: ${username}`);
                closeAddUserModal();
            } catch (error) {
                alert(`Failed to add user: ${error.message}`);
            }
        }

        function findLocalUser(userId) {
            const local = readLocalUsers();
            return { local, idx: local.findIndex(u => Number(u.id) === Number(userId)) };
        }

        async function editUser(userId) {
            const user = currentUsers.find(u => Number(u.id) === Number(userId));
            if (!user) return;
            const newRole = prompt('Update role:', user.role || 'staff');
            if (!newRole) return;
            const newDept = prompt('Update department (optional):', user.department || '');

            try {
                if (apiMode) {
                    await apiRequest(`/api/users/${userId}`, 'PUT', {
                        role: normalizeRole(newRole),
                        department: newDept || ''
                    });
                    await loadUsers();
                    return;
                }

                const { local, idx } = findLocalUser(userId);
                if (idx < 0) return;
                local[idx].role = normalizeRole(newRole);
                local[idx].department = newDept || '';
                saveLocalUsers(local);
                currentUsers = local;
                renderUsers(currentUsers);
            } catch (error) {
                alert(`Failed to update user: ${error.message}`);
            }
        }

        async function resetPassword(userId) {
            const user = currentUsers.find(u => Number(u.id) === Number(userId));
            if (!user) return;
            if (!confirm(`Reset password for ${user.email || user.username}?`)) return;
            try {
                if (apiMode) {
                    const result = await apiRequest(`/api/users/${userId}/reset-password`, 'POST', {});
                    alert(`Password reset successful.\n\nTemporary password: ${result.temporary_password}`);
                    return;
                }
                const temp = `Temp${Math.random().toString(36).slice(2, 10)}!`;
                alert(`Build mode: password reset generated locally.\n\nTemporary password: ${temp}`);
            } catch (error) {
                alert(`Failed to reset password: ${error.message}`);
            }
        }

        async function toggleUserStatus(userId) {
            const user = currentUsers.find(u => Number(u.id) === Number(userId));
            if (!user) return;
            const nextStatus = !Boolean(user.is_active);
            try {
                if (apiMode) {
                    await apiRequest(`/api/users/${userId}`, 'PUT', { is_active: nextStatus });
                    await loadUsers();
                    return;
                }
                const { local, idx } = findLocalUser(userId);
                if (idx < 0) return;
                local[idx].is_active = nextStatus;
                saveLocalUsers(local);
                currentUsers = local;
                renderUsers(currentUsers);
            } catch (error) {
                alert(`Failed to update status: ${error.message}`);
            }
        }

        function searchUsers() {
            const filter = (document.getElementById('userSearch').value || '').toLowerCase().trim();
            if (!filter) {
                renderUsers(currentUsers);
                return;
            }
            const filtered = currentUsers.filter(u => {
                const text = `${u.full_name || ''} ${u.username || ''} ${u.email || ''} ${u.role || ''}`.toLowerCase();
                return text.includes(filter);
            });
            renderUsers(filtered);
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
    <script src="../../js/runtime-fix.js"></script>
</body>

</html>
