name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          # Create _site directory for GitHub Pages
          mkdir -p _site
          
          # Copy all HTML files to root
          find . -name "*.html" -maxdepth 1 -exec cp {} _site/ \;
          
          # Copy directories
          [ -d "css" ] && cp -r css _site/
          [ -d "js" ] && cp -r js _site/
          [ -d "images" ] && cp -r images _site/
          
          # Copy manifest and other root files
          [ -f "manifest.json" ] && cp manifest.json _site/
          [ -f "robots.txt" ] && cp robots.txt _site/
          [ -f "sitemap.xml" ] && cp sitemap.xml _site/
          
          # Copy TicketingSystem if it exists
          [ -d "TicketingSystem/frontend" ] && mkdir -p _site/TicketingSystem && cp -r TicketingSystem/frontend _site/TicketingSystem/
          
          # Copy iBridge React if it exists  
          [ -d "iBridge/iBridge-react" ] && mkdir -p _site/iBridge && cp -r iBridge/iBridge-react _site/iBridge/
          
          echo "Built site structure:"
          find _site -type f | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4