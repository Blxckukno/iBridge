<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iBridge Staff Portal Access</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { background: #f5f7fb; color: #1f2937; }
    .access-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .access-card {
      width: min(760px, 100%);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    .access-card h1 { margin: 0 0 12px; color: #1B365D; }
    .access-card p { margin: 0 0 16px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #cbd5e1;
    }
    .btn-primary { background: #A1C44F; border-color: #A1C44F; color: #0D1117; }
    .btn-secondary { background: #fff; color: #1B365D; }
  </style>
</head>
<body>
  <main class="access-wrap">
    <section class="access-card">
      <h1>Staff Portal Access</h1>
      <p>This public website is deployment-ready for external users. The internal staff portal (intranet/ticketing/LMS) is hosted separately and protected.</p>
      <p>For staff access, use your internal portal URL or contact IT support.</p>
      <div class="actions">
        <a class="btn btn-primary" href="index.html">Back to Main Site</a>
        <a class="btn btn-secondary" href="contact.html">Contact IT Support</a>
      </div>
    </section>
  </main>
</body>
</html>
